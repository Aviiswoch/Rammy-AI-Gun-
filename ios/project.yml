name: RammyAIGun
options:
  bundleIdPrefix: com.rammy
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    PRODUCT_NAME: "Rammy AI Gun"
targets:
  RammyAIGun:
    type: application
    platform: iOS
    sources:
      - path: RammyAIGun
        excludes:
          - Info.plist
    info:
      path: RammyAIGun/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rammy.aigun
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0

